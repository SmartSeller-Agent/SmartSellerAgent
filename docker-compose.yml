# SmartSellerAgent — full stack with LOCAL models
# (W6: prediction service, W7: containerisation, W11: /health)
#
#   docker compose -f docker-compose.yml up --build
#
# This is what a plain `docker compose up` starts when there is no .env: the
# self-contained path, no API key needed. Copying .env.example to .env sets
# COMPOSE_FILE and switches the plain command to the hosted stack in
# docker-compose.openrouter.yml; commenting that line out comes back here.
#
# Starts four services:
#   ollama       — local LLM runtime serving the text and vision models
#   ollama-init  — one-shot job that pulls the required models, then exits
#   api          — FastAPI backend (src/app.py:api)   -> http://localhost:8000
#   frontend     — Streamlit UI (src/frontend.py)     -> http://localhost:8501
#
# api and frontend run from the same image, they only differ in their command.
#
# Values are read from .env when present (see .env.example); the defaults
# below keep the stack runnable without any local configuration.

services:
  # ------------------------------------------------------------------
  # LLM runtime — replaces the "Ollama on localhost" setup of the local dev flow
  # ------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: smartseller-ollama
    volumes:
      # Named volume so pulled models survive `docker compose down`
      - ollama-models:/root/.ollama
    # Not published by default: port 11434 is usually taken by a locally
    # installed Ollama. Uncomment to inspect the containerised one from the host.
    # ports:
    #   - "11435:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    # --- Optional: NVIDIA GPU acceleration -------------------------------
    # Without this the models run on CPU, which is slow for larger models.
    # Requires the NVIDIA Container Toolkit on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ------------------------------------------------------------------
  # One-shot model puller — makes `docker compose up` self-contained
  # ------------------------------------------------------------------
  ollama-init:
    image: ollama/ollama:latest
    container_name: smartseller-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # Talks to the ollama service instead of its own local instance
      OLLAMA_HOST: http://ollama:11434
      TEXT_MODEL_ID: ${TEXT_MODEL_ID:-qwen3:1.7b}
      VISION_MODEL_ID: ${VISION_MODEL_ID:-llava}
    # The ollama image starts the server by default — override it to run pulls.
    entrypoint: ["/bin/sh", "-c"]
    # $$ escapes the variable so Compose passes it through to the shell,
    # where it is resolved against the environment block above.
    command: >
      'echo "[init] pulling text model: $${TEXT_MODEL_ID}" &&
       ollama pull "$${TEXT_MODEL_ID}" &&
       echo "[init] pulling vision model: $${VISION_MODEL_ID}" &&
       ollama pull "$${VISION_MODEL_ID}" &&
       echo "[init] all models ready"'
    restart: "no"

  # ------------------------------------------------------------------
  # FastAPI backend — the prediction service (W6)
  # ------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartselleragent:latest
    container_name: smartseller-api
    depends_on:
      ollama-init:
        # Waits for the pulls to finish successfully before starting
        condition: service_completed_successfully
    ports:
      - "8000:8000"
      # noVNC — only serves something in the fallback mode below
      # (KLEINANZEIGEN_VNC=true). Bound to 127.0.0.1 on purpose: the view is
      # unauthenticated, and whoever reaches it controls a browser that is
      # logged into the marketplace account.
      - "127.0.0.1:6080:6080"
    extra_hosts:
      # Docker Desktop resolves this name by itself; on plain Linux it has to
      # be mapped explicitly, otherwise the CDP url below points nowhere.
      - "host.docker.internal:host-gateway"
    environment:
      # Inside the compose network the runtime is reachable by service name,
      # so these deliberately override any localhost value coming from .env.
      TEXT_API_BASE: http://ollama:11434/v1
      VISION_API_BASE: http://ollama:11434/v1
      TEXT_API_KEY: ollama
      VISION_API_KEY: ollama
      TEXT_MODEL_ID: ${TEXT_MODEL_ID:-qwen3:1.7b}
      VISION_MODEL_ID: ${VISION_MODEL_ID:-llava}
      # Observability (W5) — optional, tracing is skipped when keys are empty
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      # Set to true to log every span export to stdout (noisy, debugging only)
      OTEL_DEBUG_EXPORT: ${OTEL_DEBUG_EXPORT:-}
      # --- kleinanzeigen.de publishing ---------------------------------
      # The saved login lives on the volume mounted below, not in the image.
      KLEINANZEIGEN_STATE_DIR: /app/.state
      # DEFAULT: drive a browser running on the HOST, started separately with
      # `uv run python -m scripts.host_browser` — see that file. This is the
      # reliable path: the container's own browser has software rendering,
      # almost no fonts and a virtual screen, so the marketplace treats it as a
      # different device and refuses sessions that work everywhere else.
      # Note the "-" instead of ":-": an empty KLEINANZEIGEN_BROWSER_CDP= in
      # .env therefore wins and switches to the container browser below.
      KLEINANZEIGEN_BROWSER_CDP: ${KLEINANZEIGEN_BROWSER_CDP-http://host.docker.internal:9222}
      # FALLBACK: with an empty CDP url above, the container starts its own
      # browser; KLEINANZEIGEN_VNC=true then brings up the virtual screen and
      # the noVNC bridge (docker/entrypoint.sh) so it can be watched on 6080.
      # Off by default because the host browser needs neither.
      KLEINANZEIGEN_VNC: ${KLEINANZEIGEN_VNC:-false}
      DISPLAY: ":99"
      # Visible rather than headless. Only relevant in the fallback mode: the
      # manual login needs a window, which is what the virtual screen is for.
      # Set this and KLEINANZEIGEN_VNC the same way or the browser will not start.
      KLEINANZEIGEN_HEADLESS: ${KLEINANZEIGEN_HEADLESS:-false}
      # Chromium's own sandbox needs privileges the unprivileged container user
      # does not have; the container is the isolation boundary instead.
      KLEINANZEIGEN_NO_SANDBOX: "true"
      # SAFETY SWITCH, one of two: this allows publishing for the installation,
      # the checkbox in the UI allows it for a single run. Both are needed, and
      # neither is visible to the language model.
      KLEINANZEIGEN_ALLOW_PUBLISH: ${KLEINANZEIGEN_ALLOW_PUBLISH:-}
    # Chromium keeps its renderer memory in /dev/shm. Docker's 64 MB default is
    # not enough and makes tabs crash on content-heavy pages.
    shm_size: 1gb
    # Spans are exported in batches, so the container needs time on SIGTERM to
    # flush what is still queued. Docker's default of 10s can cut that short.
    stop_grace_period: 30s
    volumes:
      # Shared with the frontend: it writes the uploaded image here and passes
      # the path to /run-task, so both containers must see the same directory.
      - uploads:/app/test/images/uploads
      # The kleinanzeigen.de session — cookies that amount to a logged-in
      # account. A volume so it survives `docker compose down` and never ends
      # up in an image layer. Only api needs it: the browser runs there.
      - marketplace-state:/app/.state
    # W11: the /health route doubles as the container healthcheck
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Streamlit frontend — same image as api, different command
  # ------------------------------------------------------------------
  frontend:
    image: smartselleragent:latest
    container_name: smartseller-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      # 127.0.0.1 would be the frontend container itself — talk to the api service
      API_BASE_URL: http://api:8000
      # This one is the other way round: the link is opened in the user's own
      # browser, so it has to point at the published port on the host.
      VNC_URL: ${VNC_URL:-http://localhost:6080/vnc.html?autoconnect=1&resize=scale}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    volumes:
      - uploads:/app/test/images/uploads
    command:
      - streamlit
      - run
      - src/frontend.py
      - --server.address=0.0.0.0
      - --server.port=8501
      # No browser to open inside a container, and skips the first-run e-mail prompt
      - --server.headless=true
    restart: unless-stopped

volumes:
  ollama-models:
  uploads:
  marketplace-state:
