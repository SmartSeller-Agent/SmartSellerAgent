[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "smartselleragent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ddgs>=9.14.4",
    "duckduckgo-search>=8.1.1",
    "llava>=0.0.1.dev0",
    "openai>=2.41.0",
    "pathlib>=1.0.1",
    "requests>=2.34.2",
    "smolagents[toolkit]>=1.26.0",
]

[project.scripts]
smartselleragent = "src.app:main"

[tool.uv]
package = true
